repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy uses the project's uv env (locked deps), not a fresh pip install.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy --config-file=mypy.ini
        language: system
        pass_filenames: true
        require_serial: true
        types: [python]
        files: ^custom_components/
